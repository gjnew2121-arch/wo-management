<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>📅 Πρόγραμμα Αγώνων</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;min-height:100vh}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.header img{width:44px;height:44px;object-fit:contain}
.header h1{font-size:18px;font-weight:700;color:#1a3a6a;flex:1}
.header a{font-size:13px;color:#666;text-decoration:none;padding:6px 12px;border:1px solid #ccc;border-radius:6px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card-title{font-size:15px;font-weight:700;color:#222;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{margin-bottom:10px}
.lbl{font-size:12px;font-weight:600;color:#666;margin-bottom:4px}
input,select,textarea{width:100%;height:42px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:14px}
textarea{height:70px;padding:10px 12px;resize:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a3a6a}
.btn{height:42px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-blue{background:#1a3a6a;color:#fff}
.btn-gray{background:#f5f5f5;color:#666;border:1px solid #ddd}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid #e8e8e8;background:#f9f9f9;color:#888}
.filter-btn.active{background:#1a3a6a;color:#fff;border-color:#1a3a6a}
.match-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:7px 8px;margin-bottom:0;height:130px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
.match-day{font-size:10px;font-weight:700;color:#1a3a6a;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.match-title{font-size:10px;font-weight:700;color:#222;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-info{font-size:11px;color:#444;margin-bottom:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-loc{font-size:10px;color:#555;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:480px){
  .match-card{height:180px;padding:14px 16px}
  .match-day{font-size:14px;margin-bottom:4px}
  .match-title{font-size:15px;margin-bottom:6px}
  .match-info{font-size:14px;margin-bottom:4px}
  .match-loc{font-size:13px}
  #matchesList{gap:14px!important;grid-template-columns:1fr 1fr!important}
}
@media(min-width:700px){
  #matchesList{grid-template-columns:1fr 1fr!important}
}
.match-actions{display:flex;gap:6px;margin-top:10px}
.tag-eskanа{background:#e8f4fd;color:#1a6fa8;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-fea{background:#EAF3DE;color:#3B6D11;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-filiko{background:#fff8e1;color:#856404;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.empty{text-align:center;color:#999;font-size:14px;padding:24px}
.msg{font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:12px;display:none}
.msg-ok{background:#EAF3DE;color:#3B6D11}
.msg-err{background:#f8d7da;color:#721c24}
#addForm{display:none}
</style>
</head>

        <button class="filter-btn" onclick="setFilterChip('venue','Κλειστό Σιταποθηκών',this)">Κλειστό</button>
        <button class="filter-btn" onclick="setFilterChip('venue','home',this)">Εντός</button>
        <button class="filter-btn" onclick="setFilterChip('venue','away',this)">Εκτός</button>
      </div>
    </div>
  </div>

  <!-- Matches list -->
  <div id="matchesList" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><p class="empty" style="grid-column:1/-1">Φόρτωση...</p></div>

  <!-- Archive section -->
  <div id="archiveSection" style="margin-top:16px;display:none">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:15px;font-weight:700;color:#222">🗃️ Αρχείο αγώνων</div>
        <button onclick="document.getElementById('archiveSection').style.display='none'" style="background:none;border:none;font-size:18px;cursor:pointer;color:#999">✕</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <input type="month" id="archiveMonth" style="height:36px;border:1px solid #ddd;border-radius:6px;padding:0 10px;font-size:13px;flex:1">
        <select id="archiveType" style="height:36px;border:1px solid #ddd;border-radius:6px;padding:0 10px;font-size:13px;flex:1">
          <option value="all">Όλα τα είδη</option>
          <option value="ΕΣΚΑΝΑ">ΕΣΚΑΝΑ</option>
          <option value="ΦΕΑ">ΦΕΑ</option>
          <option value="Φιλικό">Φιλικό</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <select id="archiveStatus" style="height:36px;border:1px solid #ddd;border-radius:6px;padding:0 10px;font-size:13px;flex:1">
          <option value="all">Όλοι</option>
          <option value="deleted">Διαγραμμένοι</option>
          <option value="cancelled">Ακυρωθέντες</option>
        </select>
        <button onclick="loadArchive()" class="btn btn-blue" style="height:36px;padding:0 14px;font-size:13px">🔍 Εμφάνιση</button>
      </div>
      <div id="archiveList"><p class="empty">Επίλεξε φίλτρο και πάτα Εμφάνιση.</p></div>
    </div>
  </div>

</div>

<script>
var firebaseConfig={apiKey:"AIzaSyCZZnZSz8zpChx-7ScaISKehoebtO1A-qY",authDomain:"amfiali-d773b.firebaseapp.com",projectId:"amfiali-d773b",storageBucket:"amfiali-d773b.firebasestorage.app",messagingSenderId:"972320918445",appId:"1:972320918445:web:e4674ddb6b790c07efaf24"};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var auth=firebase.auth();

// Auth check - Firebase Auth
auth.onAuthStateChanged(function(user){
  if(!user){window.location.replace('login.html');}
});
var _role=localStorage.getItem('amfiali_role')||'admin';

// Show add button and archive only for admin
if(_role==='admin'){
  var abw=document.getElementById('addBtnWrap');
  if(abw)abw.style.display='block';
}

// Archive button - visible to all
var archBtn=document.createElement('button');
archBtn.textContent='🗃️ Αρχείο αγώνων';
archBtn.className='btn btn-gray';
archBtn.style.cssText='width:100%;margin-top:16px;font-size:13px';
archBtn.onclick=function(){
  var sec=document.getElementById('archiveSection');
  sec.style.display=sec.style.display==='none'?'block':'none';
};
document.querySelector('.wrap').appendChild(archBtn);

var matches=[];
var filters={day:'all',type:'all',venue:'all'};
var editId=null;

var DAY_ORDER=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'];

// Load matches
db.collection('weekly_schedule').onSnapshot(function(snap){
  matches=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
  renderMatches();
});

function setFilter(type,val,btn){
  filters[type]=val;
  renderMatches();
}

function setFilterDrop(type,val){
  filters[type]=val;
  renderMatches();
}
function setFilterChip(type,val,btn){
  filters[type]=val;
  var parent=btn.parentElement;
  parent.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderMatches();
}

function renderMatches(){
  var el=document.getElementById('matchesList');
  var filtered=matches.filter(function(m){
    if(filters.day!=='all'&&m.day!==filters.day)return false;
    if(filters.type!=='all'&&m.type!==filters.type)return false;
    if(filters.venue!=='all'){if(filters.venue==='away'){if(m.location!=='away')return false;}else if(filters.venue==='home'){if(m.location==='away')return false;}else{if(m.venueType!==filters.venue)return false;}}
    return true;
  });
  filtered.sort(function(a,b){
    if(a.date&&b.date){
      var dd=(a.date||'').localeCompare(b.date||'');
      if(dd!==0)return dd;
    }
    var di=DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day);
    if(di!==0)return di;
    return (a.time||'').localeCompare(b.time||'');
  });
  if(!filtered.length){el.innerHTML='<p class="empty" style="grid-column:1/-1">Δεν υπάρχουν αγώνες.</p>';return;}
  el.innerHTML=filtered.map(function(m){
    var tagCls=m.type==='ΕΣΚΑΝΑ'?'tag-eskanа':m.type==='ΦΕΑ'?'tag-fea':'tag-filiko';
    var adminBtns=_role==='admin'
      ?'<button style="font-size:10px;height:20px;padding:0 6px;border-radius:4px;border:1px solid #ccc;background:#f5f5f5;color:#888;cursor:pointer" data-id="'+m.id+'" onclick="editMatch(this.dataset.id)">Επεξ</button>'
       +'<button style="font-size:10px;height:20px;padding:0 6px;border-radius:4px;border:1px solid #f5c6cb;background:#f8d7da;color:#721c24;cursor:pointer" data-id="'+m.id+'" onclick="delMatch(this.dataset.id)">Διαγρ</button>'
       +'<button style="font-size:10px;height:20px;padding:0 6px;border-radius:4px;border:1px solid #d4a500;background:#fff8e1;color:#856404;cursor:pointer" data-id="'+m.id+'" onclick="cancelMatch(this.dataset.id)">Ακυρ</button>'
      :'';
    var big=window.innerWidth>=480;
    return '<div class="match-card">'
      +'<div style="margin-bottom:3px">'
       +'<span style="font-size:'+(big?'14':'11')+'px;font-weight:800;color:'+(m.day==='Κυριακή'?'#e67e22':m.day==='Σάββατο'?'#3498db':'#27ae60')+'">'+( m.day||'')+'</span>'
       +(m.date?' <span style="font-size:'+(big?'12':'10')+'px;color:#222;font-weight:600"> '+new Date(m.date+'T00:00:00').toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})+'</span>':'')
       +(m.time?' <span style="font-size:'+(big?'14':'11')+'px;font-weight:800;color:#1a3a6a"> '+m.time+'</span>':'')
       +'</div>'
      +'<div class="match-title"><span style="color:#0000ff;font-weight:800">'+m.category+'</span> <span class="'+tagCls+'" style="font-size:10px;padding:2px 6px">'+m.type+'</span></div>'
      +(m.opponent?'<div class="match-info">vs '+m.opponent+'</div>':'')
      +(m.location==='home'&&m.venueType?'<div class="match-info">'+m.venueType+'</div>':'')
      +(m.location==='away'&&m.venue?'<div class="match-info">'+m.venue+'</div>':'')
      +(m.location==='away'&&m.address?'<div class="match-loc">'+m.address+'</div>':'')
      +(m.notes?'<div class="match-loc" style="margin-top:2px">'+m.notes+'</div>':'')
      +(adminBtns?'<div class="match-actions" style="margin-top:auto">'+adminBtns+'</div>':'')
      +'</div>';
  }).join('');
}

// Auto fill day from date
document.addEventListener('DOMContentLoaded',function(){
  var dateEl=document.getElementById('sDate');
  if(dateEl){
    dateEl.addEventListener('change',function(){
      if(!this.value)return;
      var days=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
      var d=new Date(this.value+'T00:00:00');
      document.getElementById('sDay').value=days[d.getDay()];
    });
  }
});

function toggleLocation(){
  var loc=document.getElementById('sLocation').value;
  document.getElementById('homeFields').style.display=loc==='home'?'block':'none';
  document.getElementById('awayFields').style.display=loc==='away'?'block':'none';
}

function toggleForm(){
  var f=document.getElementById('addForm');
  f.style.display=f.style.display==='none'?'block':'none';
  if(f.style.display==='block')f.scrollIntoView({behavior:'smooth'});
}

function clearMatchForm(){
  editId=null;
  document.getElementById('sDate').value='';
  document.getElementById('sDay').value='Δευτέρα';
  document.getElementById('sTime').value='';
  document.getElementById('sType').value='ΕΣΚΑΝΑ';
  document.getElementById('sCategory').value='Ανδρικό';
  document.getElementById('sOpponent').value='';
  document.getElementById('sLocation').value='home';
  document.getElementById('sVenueType').value='Ανοιχτό';
  document.getElementById('sVenue').value='';
  document.getElementById('sAddress').value='';
  document.getElementById('sNotes').value='';
  toggleLocation();
  document.getElementById('formTitle').textContent='➕ Νέος αγώνας';
  document.getElementById('addForm').style.display='none';
}

function showFormMsg(txt,ok){
  var el=document.getElementById('formMsg');
  el.textContent=txt;el.className='msg '+(ok?'msg-ok':'msg-err');
  el.style.display='block';
  setTimeout(function(){el.style.display='none';},3000);
}

async function saveMatch(){
  var loc=document.getElementById('sLocation').value;
  var data={
    date:document.getElementById('sDate').value,
    day:document.getElementById('sDay').value,
    time:document.getElementById('sTime').value,
    type:document.getElementById('sType').value,
    category:document.getElementById('sCategory').value,
    opponent:document.getElementById('sOpponent').value.trim(),
    location:loc,
    venueType:loc==='home'?document.getElementById('sVenueType').value:'',
    venue:loc==='away'?document.getElementById('sVenue').value.trim():'',
    address:loc==='away'?document.getElementById('sAddress').value.trim():'',
    notes:document.getElementById('sNotes').value.trim()
  };
  try{
    if(editId){
      await db.collection('weekly_schedule').doc(editId).update(data);
    }else{
      await db.collection('weekly_schedule').add(data);
    }
    showFormMsg('✅ Αποθηκεύτηκε!',true);
    clearMatchForm();
  }catch(e){showFormMsg('Σφάλμα: '+e.message,false);}
}

window.editMatch=async function(id){
  var m=matches.find(function(x){return x.id===id;});
  if(!m)return;
  editId=id;
  document.getElementById('sDate').value=m.date||'';
  document.getElementById('sDay').value=m.day||'Δευτέρα';
  document.getElementById('sTime').value=m.time||'';
  document.getElementById('sType').value=m.type||'ΕΣΚΑΝΑ';
  document.getElementById('sCategory').value=m.category||'Ανδρικό';
  document.getElementById('sOpponent').value=m.opponent||'';
  document.getElementById('sLocation').value=m.location||'home';
  toggleLocation();
  if(m.location==='home'){
    document.getElementById('sVenueType').value=m.venueType||'Ανοιχτό';
  }else{
    document.getElementById('sVenue').value=m.venue||'';
    document.getElementById('sAddress').value=m.address||'';
  }
  document.getElementById('sAddress').value=m.address||'';
  document.getElementById('sNotes').value=m.notes||'';
  document.getElementById('formTitle').textContent='✏️ Επεξεργασία αγώνα';
  document.getElementById('addForm').style.display='block';
  document.getElementById('addForm').scrollIntoView({behavior:'smooth'});
};

async function loadArchive(){
  var el=document.getElementById('archiveList');
  el.innerHTML='<p class="empty">Φόρτωση...</p>';
  try{
    var snap=await db.collection('deleted_matches').get();
    var docs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    var month=document.getElementById('archiveMonth').value;
    var type=document.getElementById('archiveType').value;
    if(month)docs=docs.filter(function(d){return(d.deletedAt||'').startsWith(month);});
    if(type!=='all')docs=docs.filter(function(d){return d.type===type;});
    var status=document.getElementById('archiveStatus').value;
    if(status==='deleted')docs=docs.filter(function(d){return d.reason!=='cancelled';});
    if(status==='cancelled')docs=docs.filter(function(d){return d.reason==='cancelled';});
    docs.sort(function(a,b){return(b.deletedAt||'').localeCompare(a.deletedAt||'');});
    if(!docs.length){el.innerHTML='<p class="empty">Δεν βρέθηκαν αγώνες.</p>';return;}
    el.innerHTML=docs.map(function(m){
      var tagCls=m.type==='ΕΣΚΑΝΑ'?'tag-eskanа':m.type==='ΦΕΑ'?'tag-fea':'tag-filiko';
      var dayColor=m.day==='Κυριακή'?'#e67e22':m.day==='Σάββατο'?'#3498db':'#27ae60';
      var statusBadge=m.reason==='cancelled'
        ?'<span style="font-size:10px;background:#fff8e1;color:#856404;border:1px solid #d4a500;border-radius:4px;padding:1px 6px;margin-left:6px">Ακυρώθηκε</span>'
        :'<span style="font-size:10px;background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;border-radius:4px;padding:1px 6px;margin-left:6px">Διαγράφηκε</span>';
      var delBtn=_role==='admin'
        ?'<div style="margin-top:6px;display:flex;gap:6px">'
         +'<button style="font-size:10px;height:20px;padding:0 6px;border-radius:4px;border:1px solid #3B6D11;background:#EAF3DE;color:#3B6D11;cursor:pointer" data-id="'+m.id+'" onclick="restoreMatch(this.dataset.id)">↩️ Επαναφορά</button>'
         +'<button style="font-size:10px;height:20px;padding:0 6px;border-radius:4px;border:1px solid #f5c6cb;background:#f8d7da;color:#721c24;cursor:pointer" data-id="'+m.id+'" onclick="permDelArchive(this.dataset.id)">🗑️ Οριστική διαγραφή</button>'
         +'</div>'
        :'';
      return '<div class="match-card" style="opacity:0.85">'
        +'<div style="margin-bottom:4px">'
        +'<span style="font-size:14px;font-weight:800;color:'+dayColor+'">'+(m.day||'')+'</span>'
        +(m.date?' <span style="font-size:11px;color:#222;font-weight:600">'+new Date(m.date+'T00:00:00').toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})+'</span>':'')
        +(m.time?' <span style="font-size:14px;font-weight:700;color:#1a3a6a"> '+m.time+'</span>':'')
        +statusBadge
        +'</div>'
        +'<div class="match-title">'+m.category+' <span class="'+tagCls+'" style="font-size:12px">'+m.type+'</span></div>'
        +(m.opponent?'<div class="match-info">vs '+m.opponent+'</div>':'')
        +(m.location==='home'&&m.venueType?'<div class="match-info">'+m.venueType+'</div>':'')
        +(m.location==='away'&&m.venue?'<div class="match-info">'+m.venue+'</div>':'')
        +'<div style="font-size:10px;color:#bbb;margin-top:4px">'+(m.reason==='cancelled'?'Ακυρώθηκε':'Διαγράφηκε')+': '+m.deletedAt+'</div>'
        +delBtn
        +'</div>';
    }).join('');
  }catch(e){el.innerHTML='<p class="empty">Σφάλμα: '+e.message+'</p>';}
}

window.cancelMatch=async function(id){
  if(!confirm('Να σημειωθεί ως Ακυρωθείς;'))return;
  try{
    var m=matches.find(function(x){return x.id===id;});
    if(m){
      var archived=Object.assign({},m);
      delete archived.id;
      archived.deletedAt=new Date().toISOString().slice(0,10);
      archived.reason='cancelled';
      await db.collection('deleted_matches').add(archived);
    }
    await db.collection('weekly_schedule').doc(id).delete();
  }catch(e){alert('Σφάλμα: '+e.message);}
};

window.restoreMatch=async function(id){
  if(!confirm('Επαναφορά αγώνα στο πρόγραμμα;'))return;
  try{
    var snap=await db.collection('deleted_matches').doc(id).get();
    if(snap.exists){
      var data=snap.data();
      delete data.deletedAt;
      delete data.reason;
      await db.collection('weekly_schedule').add(data);
      await db.collection('deleted_matches').doc(id).delete();
      loadArchive();
    }
  }catch(e){alert('Σφάλμα: '+e.message);}
};

window.permDelArchive=async function(id){
  if(!confirm('Οριστική διαγραφή από το αρχείο;'))return;
  try{await db.collection('deleted_matches').doc(id).delete();loadArchive();}
  catch(e){alert('Σφάλμα: '+e.message);}
};

window.delMatch=async function(id){
  if(!confirm('Διαγραφή αγώνα; Θα αποθηκευτεί στο αρχείο.'))return;
  try{
    var m=matches.find(function(x){return x.id===id;});
    if(m){
      var archived=Object.assign({},m);
      delete archived.id;
      archived.deletedAt=new Date().toISOString().slice(0,10);
      await db.collection('deleted_matches').add(archived);
    }
    await db.collection('weekly_schedule').doc(id).delete();
  }catch(e){alert('Σφάλμα: '+e.message);}
};
</script>
</body>
</html>

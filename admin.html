<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="home.html" class="nav-logo">
    <div class="nav-dot-gainjet"></div><div class="nav-dot-gjet" style="margin-left:-2px;margin-right:4px"></div>WO Management
  </a>
  <a href="home.html"  class="nav-link" data-page="home">Home</a>
  <a href="admin.html" class="nav-link active" data-page="admin" id="nav-admin">Users</a>
  <div class="nav-right">
    <span class="nav-user"   id="nav-user"></span>
    <span class="role-badge" id="nav-role"></span>
    <button class="btn-signout" id="btn-signout">Sign out</button>
  </div>
</nav>

<div class="page-wrap">
  <h1 class="page-title">User management</h1>

  <div class="card">
    <div class="card-title">Create new user</div>
    <div class="admin-grid">
      <div class="field"><label>Full name</label><input id="u-name" placeholder="John Technician"></div>
      <div class="field"><label>Email</label><input type="email" id="u-email" placeholder="tech@company.com"></div>
      <div class="field"><label>Password</label><input type="password" id="u-pass" placeholder="Min 6 characters"></div>
      <div class="field"><label>Company</label>
        <select id="u-company">
          <option value="GAINJET">GAINJET</option>
          <option value="GJET">GJET</option>
          <option value="both">Both (GAINJET + GJET)</option>
        </select>
      </div>
      <div class="field"><label>Role</label>
        <select id="u-role">
          <option value="viewer">Viewer — read only</option>
          <option value="editor">Editor — create &amp; edit WOs</option>
          <option value="admin">Admin — full access</option>
        </select>
      </div>
      <div class="admin-full" style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-blue" id="btn-create">Create user</button>
        <span id="create-msg"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Users <span id="user-count" style="color:#aaa;font-weight:400"></span></div>
    <table class="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Company</th>
          <th>Role</th>
          <th>Change role</th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <tr><td colspan="5" style="padding:20px;color:#aaa">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { auth, db }    from './js/firebase-config.js'
import { requireAuth, setupNav, showToast } from './js/auth.js'
import { createUserWithEmailAndPassword }   from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"
import { collection, getDocs, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"

requireAuth((user, role, company) => {
  if (role !== 'admin') { window.location.href = 'home.html'; return }
  setupNav(user, role, company, 'admin')
  loadUsers()
})

async function loadUsers() {
  const snap  = await getDocs(collection(db, 'users'))
  const users = snap.docs.map(d => ({ id: d.id, ...d.data() }))
  document.getElementById('user-count').textContent = `(${users.length})`

  const roleColors = {
    admin:  'background:#fce4ec;color:#c62828',
    editor: 'background:#e3f2fd;color:#1565c0',
    viewer: 'background:#f3e5f5;color:#6a1b9a',
  }
  const coColors = {
    GAINJET: 'background:#e3f2fd;color:#1565c0',
    GJET:    'background:#fff3e0;color:#e65100',
    both:    'background:#f3e5f5;color:#6a1b9a',
  }

  document.getElementById('users-tbody').innerHTML = users.map(u => `
    <tr>
      <td style="font-weight:500">${u.displayName||'—'}</td>
      <td style="color:#555">${u.email||''}</td>
      <td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;${coColors[u.company]||''}">${u.company||'—'}</span></td>
      <td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;${roleColors[u.role]||''}">${u.role||'viewer'}</span></td>
      <td>
        <select onchange="changeRole('${u.id}', this.value)">
          <option${u.role==='viewer'?' selected':''} value="viewer">viewer</option>
          <option${u.role==='editor'?' selected':''} value="editor">editor</option>
          <option${u.role==='admin'?' selected':''}  value="admin">admin</option>
        </select>
      </td>
    </tr>`).join('')
}

window.changeRole = async (uid, newRole) => {
  try {
    await setDoc(doc(db,'users',uid),{role:newRole},{merge:true})
    showToast('Role updated to '+newRole,'success')
    loadUsers()
  } catch(err) { showToast('Error: '+err.message,'error') }
}

document.getElementById('btn-create').addEventListener('click', async () => {
  const name    = document.getElementById('u-name').value.trim()
  const email   = document.getElementById('u-email').value.trim()
  const pass    = document.getElementById('u-pass').value
  const company = document.getElementById('u-company').value
  const role    = document.getElementById('u-role').value
  const msg     = document.getElementById('create-msg')

  if (!name||!email||!pass) { msg.textContent='All fields required.'; msg.className='msg-err'; return }

  const btn=document.getElementById('btn-create')
  btn.disabled=true; btn.textContent='Creating…'; msg.textContent=''

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass)
    await setDoc(doc(db,'users',cred.user.uid), {
      email, displayName:name, role, company, createdAt:serverTimestamp()
    })
    msg.textContent=`✓ User created: ${email}`; msg.className='msg-ok'
    document.getElementById('u-name').value=''
    document.getElementById('u-email').value=''
    document.getElementById('u-pass').value=''
    loadUsers()
  } catch(err) {
    msg.textContent='Error: '+err.message; msg.className='msg-err'
  } finally {
    btn.disabled=false; btn.textContent='Create user'
  }
})
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GainJet Work Orders</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

  nav { background: #1565c0; color: #fff; padding: 0 16px; display: flex; align-items: center; gap: 12px; height: 52px; }
  nav .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: .5px; }
  nav a { color: #fff; text-decoration: none; font-size: .88rem; opacity: .85; }
  nav a:hover { opacity: 1; }
  nav .spacer { flex: 1; }
  #userInfo { font-size: .82rem; opacity: .8; }
  #logoutBtn { background: rgba(255,255,255,.15); border: none; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: .82rem; }
  #logoutBtn:hover { background: rgba(255,255,255,.28); }

  .controls { background: #fff; border-bottom: 1px solid #ddd; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls input, .controls select { border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; font-size: .85rem; }
  .controls input[type=text] { width: 200px; }
  .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: .85rem; font-weight: 600; }
  .btn-primary { background: #1565c0; color: #fff; }
  .btn-primary:hover { background: #0d47a1; }
  .btn-danger  { background: #c62828; color: #fff; }
  .btn-danger:hover  { background: #b71c1c; }
  .btn-sm { padding: 3px 9px; font-size: .78rem; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #eee; }
  .stat-card { background: #f0f4ff; border: 1px solid #c5cae9; border-radius: 6px; padding: 6px 14px; font-size: .82rem; text-align: center; min-width: 90px; }
  .stat-card .num { font-size: 1.2rem; font-weight: 700; color: #1565c0; }
  .stat-card .lbl { color: #555; }
  .stat-card.green { background: rgba(76,175,80,.18); border-color: #4caf50; }
  .stat-card.green .num { color: #2e7d32; }
  .stat-card.blue  { background: rgba(33,150,243,.18); border-color: #2196f3; }
  .stat-card.blue  .num { color: #1565c0; }
  .stat-card.red   { background: rgba(244,67,54,.18);  border-color: #f44336; }
  .stat-card.red   .num { color: #c62828; }

  .table-wrap { overflow-x: auto; max-height: calc(100vh - 210px); }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 1400px; }
  thead th { background: #1565c0; color: #fff; padding: 8px 6px; position: sticky; top: 0; z-index: 2; white-space: nowrap; text-align: left; cursor: pointer; user-select: none; }
  thead th:first-child { position: sticky; top: 0; left: 0; z-index: 3; }
  thead th:hover { background: #0d47a1; }
  tbody tr { border-bottom: 1px solid #e0e0e0; }
  tbody tr:hover { filter: brightness(.96); }
  tbody td:first-child { position: sticky; left: 0; z-index: 1; font-weight: 600; border-right: 2px solid #c5cae9; }
  td { padding: 6px 6px; vertical-align: middle; white-space: nowrap; }
  td.wrap { white-space: normal; min-width: 180px; max-width: 260px; word-break: break-word; }

  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }

  .pagination { display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: #fff; border-top: 1px solid #eee; flex-wrap: wrap; }
  .pagination button { border: 1px solid #ccc; background: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: .82rem; }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .pagination button.active { background: #1565c0; color: #fff; border-color: #1565c0; }
  .pagination select { border: 1px solid #ccc; border-radius: 4px; padding: 4px 6px; font-size: .82rem; }
  .page-info { font-size: .82rem; color: #555; margin-left: 8px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 8px; width: 700px; max-width: 96vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
  .modal-header { background: #1565c0; color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-radius: 8px 8px 0 0; }
  .modal-header h3 { font-size: 1rem; }
  .modal-close { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; line-height: 1; }
  .modal-body { padding: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1/-1; }
  .form-group label { font-size: .8rem; font-weight: 600; color: #444; }
  .form-group input, .form-group select, .form-group textarea { border: 1px solid #ccc; border-radius: 4px; padding: 7px 10px; font-size: .85rem; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .modal-footer { padding: 12px 18px; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: .88rem; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { background: #2e7d32; }
  .toast.error   { background: #c62828; }

  .loading { text-align: center; padding: 40px; color: #888; }
  .empty   { text-align: center; padding: 40px; color: #aaa; font-size: .95rem; }
</style>
</head>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"
import { getAuth, onAuthStateChanged, signOut }
                           from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, getDoc }
                           from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"

const firebaseConfig = {
  apiKey:            "AIzaSyDVWVXKhxg0nEK08D2OBOKJKyomf30-5ZE",
  authDomain:        "worecord-e9fe8.firebaseapp.com",
  projectId:         "worecord-e9fe8",
  storageBucket:     "worecord-e9fe8.firebasestorage.app",
  messagingSenderId: "443518548336",
  appId:             "1:443518548336:web:6f9fbad37d319ae9c6b7b5"
}
const app  = initializeApp(firebaseConfig)
const auth = getAuth(app)
const db   = getFirestore(app)

const COLLECTION  = 'gainjet_workOrders'
const DEL_COLL    = 'gainjet_deletedWOs'
const SESSION_KEY = 'wo_login_time'
const SESSION_TTL = 86400000

// ── SESSION ──────────────────────────────────────────────────────────────────
const _st = localStorage.getItem(SESSION_KEY)
if (!_st || (Date.now() - parseInt(_st)) > SESSION_TTL) {
  localStorage.removeItem(SESSION_KEY)
  location.href = 'index.html'
}

// ── GLOBALS ──────────────────────────────────────────────────────────────────
let allWOs      = []
let filtered    = []
let pageSize    = 50
let currentPage = 1
let editingId   = null
let userRole    = 'viewer'
let userName    = ''
let sortField   = 'wo_number'
let sortDir     = -1   // -1 = desc (newest first), 1 = asc

// ── STATUS ────────────────────────────────────────────────────────────────────
const STATUS = {
  OPEN:   { key:'OPEN',   label:'Open WO',                       dot:'#9e9e9e', bg:'#ffffff',               border:'#e0e0e0' },
  CLOSED: { key:'CLOSED', label:'WO Completed',                  dot:'#2e7d32', bg:'rgba(76,175,80,0.25)',   border:'#4caf50' },
  DOCS:   { key:'DOCS',   label:'WO Completed – Docs in office', dot:'#1565c0', bg:'rgba(33,150,243,0.25)', border:'#2196f3' },
  CNX:    { key:'CNX',    label:'Cancelled',                     dot:'#c62828', bg:'rgba(244,67,54,0.22)',  border:'#f44336' },
}
function getStatus(wo) {
  if (wo.status === 'CNX')                              return STATUS.CNX
  if (wo.status === 'CLOSED' && wo.wp_filed === 'YES') return STATUS.DOCS
  if (wo.status === 'CLOSED')                           return STATUS.CLOSED
  return STATUS.OPEN
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg, type='') {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = 'toast show ' + type
  setTimeout(() => el.className = 'toast', 2800)
}

// ── DATE FORMAT ───────────────────────────────────────────────────────────────
// Handles: Firestore Timestamp, ISO string "2025-07-31", string with time "2025-07-31 00:00:00"
function fmtDate(v) {
  if (!v) return ''
  // Firestore Timestamp object
  if (v && typeof v === 'object' && v.seconds) {
    return new Date(v.seconds * 1000).toISOString().slice(0, 10)
  }
  // String — take only first 10 chars (YYYY-MM-DD)
  const str = String(v).trim()
  if (!str || str === 'NaN' || str === 'null' || str === 'undefined') return ''
  return str.slice(0, 10)
}

// Date value for year extraction
function getYear(v) {
  const d = fmtDate(v)
  return d ? d.slice(0, 4) : ''
}

// ── WO NUMBER GENERATOR ───────────────────────────────────────────────────────
// Format: GJ + YY + MM + 3-digit sequence (total 9 chars), e.g. GJ260902251
// Sequence continues globally — never resets per month
function generateWONumber() {
  const now    = new Date()
  const yy     = String(now.getFullYear()).slice(2)
  const mm     = String(now.getMonth() + 1).padStart(2, '0')
  const prefix = `GJ${yy}${mm}`   // e.g. "GJ2610"
  // Find max seq across ALL months of current year (global sequence, never resets)
  // Only look at properly formatted WOs: GJ + YY(2) + MM(2) + seq(4) = 10 chars
  // AND only for the current year (GJ26...)
  const yearPrefix = `GJ${yy}`
  let maxSeq = 0
  allWOs.forEach(w => {
    if (!w.wo_number) return
    const wo = String(w.wo_number).trim()
    if (wo.startsWith(yearPrefix) && wo.length === 10) {
      const seq = parseInt(wo.slice(6)) || 0
      if (seq > maxSeq) maxSeq = seq
    }
  })
  return prefix + String(maxSeq + 1).padStart(4, '0')
}

// ── SERIAL NUMBER GENERATOR ───────────────────────────────────────────────────
function generateSerialNumber() {
  let max = 0
  allWOs.forEach(w => {
    const n = parseInt(w.serial_number) || 0
    if (n > max) max = n
  })
  return max + 1
}

// ── SORT ──────────────────────────────────────────────────────────────────────
window.sortBy = function(field) {
  if (sortField === field) {
    sortDir = -sortDir
  } else {
    sortField = field
    sortDir   = (field === 'serial_number' || field === 'wo_number') ? -1 : 1
  }
  applyFilters()
}

function sortRecords(arr) {
  return [...arr].sort((a, b) => {
    let va = a[sortField]
    let vb = b[sortField]

    if (sortField === 'serial_number') {
      va = parseInt(va) || 0
      vb = parseInt(vb) || 0
      return (va - vb) * sortDir
    }

    if (sortField === 'wo_number') {
      // Extract numeric part after GJ+YYMM for proper numeric sort
      // Valid format: GJYYMMxxxx (10 chars) → use last 4 digits
      // Invalid/old format → sort alphabetically at the end
      const getWOSeq = s => {
        const str = String(s || '')
        if (str.startsWith('GJ') && str.length === 10) return parseInt(str.slice(6)) || 0
        return -1  // push invalid formats to bottom
      }
      return (getWOSeq(va) - getWOSeq(vb)) * sortDir
    }

    if (sortField === 'issue_date') {
      va = fmtDate(va) || ''
      vb = fmtDate(vb) || ''
    } else {
      va = String(va || '').toLowerCase()
      vb = String(vb || '').toLowerCase()
    }
    if (va < vb) return -1 * sortDir
    if (va > vb) return  1 * sortDir
    return 0
  })
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────────
async function loadWOs() {
  try {
    const snap = await getDocs(collection(db, COLLECTION))
    allWOs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    buildFilters()
    applyFilters()
  } catch(e) {
    document.getElementById('woBody').innerHTML =
      `<tr><td colspan="18" class="empty">Error loading data: ${e.message}</td></tr>`
  }
}

// ── FILTER DROPDOWNS ──────────────────────────────────────────────────────────
function buildFilters() {
  const aircraft = [...new Set(allWOs.map(w => w.aircraft).filter(Boolean))].sort()
  const years    = [...new Set(allWOs.map(w => getYear(w.issue_date)).filter(Boolean))].sort().reverse()
  const aEl = document.getElementById('aircraftFilter')
  const yEl = document.getElementById('yearFilter')
  const aVal = aEl.value, yVal = yEl.value
  aEl.innerHTML = '<option value="">All Aircraft</option>' +
    aircraft.map(a => `<option value="${a}">${a}</option>`).join('')
  yEl.innerHTML = '<option value="">All Years</option>' +
    years.map(y => `<option value="${y}">${y}</option>`).join('')
  aEl.value = aVal; yEl.value = yVal
}

// ── APPLY FILTERS ─────────────────────────────────────────────────────────────
function applyFilters() {
  const search   = document.getElementById('searchInput').value.toLowerCase()
  const status   = document.getElementById('statusFilter').value
  const aircraft = document.getElementById('aircraftFilter').value
  const year     = document.getElementById('yearFilter').value

  let result = allWOs.filter(wo => {
    const st = getStatus(wo)
    const matchStatus   = !status   || st.key === status
    const matchAircraft = !aircraft || wo.aircraft === aircraft
    const matchYear     = !year     || getYear(wo.issue_date) === year
    const matchSearch   = !search   ||
      [wo.wo_number, wo.aircraft, wo.description, wo.issued_by,
       wo.remarks, wo.location, wo.part_145, String(wo.serial_number||'')]
      .join(' ').toLowerCase().includes(search)
    return matchStatus && matchAircraft && matchYear && matchSearch
  })

  filtered    = sortRecords(result)
  currentPage = 1
  renderStats()
  renderTable()
  renderPagination()
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const counts = { OPEN:0, CLOSED:0, DOCS:0, CNX:0 }
  filtered.forEach(w => counts[getStatus(w).key]++)
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${filtered.length}</div><div class="lbl">Total (filtered)</div></div>
    <div class="stat-card"><div class="num">${counts.OPEN}</div><div class="lbl">Open</div></div>
    <div class="stat-card green"><div class="num">${counts.CLOSED}</div><div class="lbl">Completed</div></div>
    <div class="stat-card blue"><div class="num">${counts.DOCS}</div><div class="lbl">Docs in Office</div></div>
    <div class="stat-card red"><div class="num">${counts.CNX}</div><div class="lbl">Cancelled</div></div>
  `
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable() {
  const start    = (currentPage - 1) * pageSize
  const page     = filtered.slice(start, start + pageSize)
  const body     = document.getElementById('woBody')
  const canEdit  = userRole === 'admin' || userRole === 'editor'
  const canDel   = userRole === 'admin' || userRole === 'editor'

  if (!page.length) {
    body.innerHTML = `<tr><td colspan="18" class="empty">No work orders found.</td></tr>`
    return
  }

  body.innerHTML = page.map(wo => {
    const st = getStatus(wo)
    return `<tr style="background:${st.bg};border-left:4px solid ${st.border}">
      <td>${wo.wo_number || ''}</td>
      <td>${fmtDate(wo.issue_date)}</td>
      <td>${fmtDate(wo.due_limit) || wo.due_limit || ''}</td>
      <td>${wo.aircraft || ''}</td>
      <td>${wo.issued_by || ''}</td>
      <td>${wo.part_145 || ''}</td>
      <td class="wrap">${wo.description || ''}</td>
      <td>${fmtDate(wo.closed_date)}</td>
      <td>${wo.cmp_trxl || ''}</td>
      <td><span class="dot" style="background:${st.dot}"></span>${st.label}</td>
      <td>${wo.pkg_rcv || ''}</td>
      <td>${wo.wp_filed || ''}</td>
      <td>${wo.location || ''}</td>
      <td>${wo.cmp_list || ''}</td>
      <td>${wo.form_m28 || ''}</td>
      <td>${wo.entered_by || ''}</td>
      <td class="wrap">${wo.remarks || ''}</td>
      <td style="white-space:nowrap">
        ${canEdit ? `<button class="btn btn-sm btn-primary" data-edit="${wo.id}">Edit</button> ` : ''}
        ${canDel  ? `<button class="btn btn-sm btn-danger"  data-del="${wo.id}">Del</button>` : ''}
      </td>
    </tr>`
  }).join('')

  // Attach events via data attributes (avoids module scope issues)
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => openEdit(btn.dataset.edit))
  })
  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => archiveWO(btn.dataset.del))
  })
}

// ── PAGINATION ────────────────────────────────────────────────────────────────
function renderPagination() {
  const total = Math.ceil(filtered.length / pageSize)
  const bar   = document.getElementById('paginationBar')
  const sizeSel = `<select id="pageSizeSel">
    ${[25,50,100,200].map(n=>`<option value="${n}"${n===pageSize?' selected':''}>${n}/page</option>`).join('')}
  </select>`

  if (total <= 1) {
    bar.innerHTML = sizeSel + `<span class="page-info">${filtered.length} records</span>`
  } else {
    let btns = `<button id="prevBtn" ${currentPage===1?'disabled':''}>‹ Prev</button>`
    for (let p = Math.max(1,currentPage-3); p <= Math.min(total,currentPage+3); p++) {
      btns += `<button class="pg-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`
    }
    btns += `<button id="nextBtn" ${currentPage===total?'disabled':''}>Next ›</button>`
    bar.innerHTML = sizeSel + btns + `<span class="page-info">${filtered.length} records | Page ${currentPage}/${total}</span>`
  }

  bar.querySelector('#pageSizeSel')?.addEventListener('change', e => {
    pageSize = parseInt(e.target.value); currentPage = 1; renderTable(); renderPagination()
  })
  bar.querySelector('#prevBtn')?.addEventListener('click', () => { currentPage--; renderTable(); renderPagination() })
  bar.querySelector('#nextBtn')?.addEventListener('click', () => { currentPage++; renderTable(); renderPagination() })
  bar.querySelectorAll('.pg-btn').forEach(btn => {
    btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); renderTable(); renderPagination() })
  })
}

// ── MODAL OPEN ────────────────────────────────────────────────────────────────
function openModal(wo = null) {
  editingId = wo ? wo.id : null
  document.getElementById('modalTitle').textContent = wo ? 'Edit Work Order' : 'New Work Order'
  document.getElementById('fWoNum').value       = wo ? (wo.wo_number   || '') : generateWONumber()
  document.getElementById('fIssueDate').value   = wo ? fmtDate(wo.issue_date)  : new Date().toISOString().slice(0,10)
  document.getElementById('fDueLimit').value    = wo ? (wo.due_limit   || '') : ''
  document.getElementById('fAircraft').value    = wo ? (wo.aircraft    || '') : ''
  document.getElementById('fIssuedBy').value    = wo ? (wo.issued_by   || '') : ''
  document.getElementById('fPart145').value     = wo ? (wo.part_145    || '') : ''
  document.getElementById('fDescription').value = wo ? (wo.description || '') : ''
  document.getElementById('fClosedDate').value  = wo ? fmtDate(wo.closed_date) : ''
  document.getElementById('fCmpTrxl').value     = wo ? (wo.cmp_trxl   || '') : ''
  document.getElementById('fStatus').value      = wo ? (wo.status      || 'OPEN') : 'OPEN'
  document.getElementById('fPkgRcv').value      = wo ? (wo.pkg_rcv    || '') : ''
  document.getElementById('fWpFiled').value     = wo ? (wo.wp_filed   || '') : ''
  document.getElementById('fLocation').value    = wo ? (wo.location   || '') : ''
  document.getElementById('fCmpList').value     = wo ? (wo.cmp_list   || '') : ''
  document.getElementById('fFormM28').value     = wo ? (wo.form_m28   || '') : ''
  document.getElementById('fEnteredBy').value   = wo ? (wo.entered_by || '') : userName
  document.getElementById('fRemarks').value     = wo ? (wo.remarks    || '') : ''
  document.getElementById('modalOverlay').classList.add('open')
}

function openEdit(id) {
  const wo = allWOs.find(w => w.id === id)
  if (wo) openModal(wo)
}

// ── ARCHIVE (soft-delete) ─────────────────────────────────────────────────────
async function archiveWO(id) {
  if (!confirm('Move this WO to archive (deleted)?')) return
  const wo = allWOs.find(w => w.id === id)
  if (!wo) return
  try {
    await addDoc(collection(db, DEL_COLL), { ...wo, deletedAt: serverTimestamp(), deletedBy: userName })
    await deleteDoc(doc(db, COLLECTION, id))
    toast('WO archived', 'success')
    await loadWOs()
  } catch(e) { toast('Error: ' + e.message, 'error') }
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
document.getElementById('modalSave').addEventListener('click', async () => {
  const woNum = document.getElementById('fWoNum').value.trim()
  if (!woNum) { toast('WO Number required', 'error'); return }

  const serialNum = generateSerialNumber()

  const payload = {
    wo_number:     woNum,
    serial_number: serialNum,
    issue_date:    document.getElementById('fIssueDate').value   || null,
    due_limit:     document.getElementById('fDueLimit').value    || '',
    aircraft:      document.getElementById('fAircraft').value    || '',
    issued_by:     document.getElementById('fIssuedBy').value    || '',
    part_145:      document.getElementById('fPart145').value     || '',
    description:   document.getElementById('fDescription').value || '',
    closed_date:   document.getElementById('fClosedDate').value  || null,
    cmp_trxl:      document.getElementById('fCmpTrxl').value     || '',
    status:        document.getElementById('fStatus').value,
    pkg_rcv:       document.getElementById('fPkgRcv').value      || '',
    wp_filed:      document.getElementById('fWpFiled').value     || '',
    location:      document.getElementById('fLocation').value    || '',
    cmp_list:      document.getElementById('fCmpList').value     || '',
    form_m28:      document.getElementById('fFormM28').value     || '',
    entered_by:    document.getElementById('fEnteredBy').value   || '',
    remarks:       document.getElementById('fRemarks').value     || '',
    updatedAt:     serverTimestamp(),
  }

  try {
    if (editingId) {
      await updateDoc(doc(db, COLLECTION, editingId), payload)
      toast('WO updated', 'success')
    } else {
      payload.createdAt = serverTimestamp()
      await addDoc(collection(db, COLLECTION), payload)
      toast('WO created', 'success')
    }
    document.getElementById('modalOverlay').classList.remove('open')
    await loadWOs()
  } catch(e) { toast('Error: ' + e.message, 'error') }
})

// ── MODAL CLOSE ───────────────────────────────────────────────────────────────
document.getElementById('modalClose').addEventListener('click',  () => document.getElementById('modalOverlay').classList.remove('open'))
document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('open'))
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open')
})

// ── FILTERS ───────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', applyFilters)
document.getElementById('statusFilter').addEventListener('change', applyFilters)
document.getElementById('aircraftFilter').addEventListener('change', applyFilters)
document.getElementById('yearFilter').addEventListener('change', applyFilters)
document.getElementById('newWOBtn').addEventListener('click', () => openModal())
document.getElementById('logoutBtn').addEventListener('click', async () => {
  localStorage.removeItem(SESSION_KEY)
  await signOut(auth)
  location.href = 'login.html'
})

// ── AUTH ──────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'login.html'; return }
  try {
    const uSnap = await getDoc(doc(db, 'users', user.uid))
    if (uSnap.exists()) {
      const ud  = uSnap.data()
      userRole  = ud.role    || 'viewer'
      userName  = ud.displayName || user.email
      const company = ud.company || ''
      if (userRole !== 'admin' && company !== 'GAINJET' && company !== 'both') {
        location.href = 'index.html'; return
      }
    }
  } catch(e) { console.warn('Could not load user profile', e) }
  document.getElementById('userInfo').textContent = `${userName} (${userRole})`
  if (userRole === 'admin' || userRole === 'editor') {
    document.getElementById('newWOBtn').style.display = ''
  }
  await loadWOs()
})
</script>
